<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0a12">
<meta name="robots" content="noindex">
<title>Host — Party Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body class="hub">
<div class="wrap" style="padding-bottom:48px">
  <header>
    <h1>Party Games</h1>
    <div class="sub" id="who"></div>
  </header>

  <div class="card hidden" id="login">
    <h2>🎉 Host a game</h2>
    <p class="sub" style="text-align:left;margin:0 0 16px">Sign in once to set up games for your party and share a link. Guests don't need an account.</p>
    <button class="gbtn" id="google" type="button">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <details class="alt">
      <summary>Sign in with email &amp; password (testing)</summary>
      <form id="pwForm">
        <label class="f" for="em">Email</label><input class="in" id="em" type="email" autocomplete="username" required>
        <label class="f" for="pw">Password</label><input class="in" id="pw" type="password" autocomplete="current-password" required>
        <button class="ghost" style="width:100%;margin-top:12px">Sign in</button>
      </form>
    </details>
    <div class="err" id="loginErr"></div>
    <p class="sub" style="font-size:12px;margin:14px 0 0"><a href="privacy.html" style="color:var(--muted)">Privacy</a></p>
  </div>

  <div id="panel" class="hidden">
    <h2 style="font-size:18px;margin:0 0 12px">Your games</h2>
    <div class="games" id="games"></div>
    <div style="text-align:center;margin-top:24px"><button class="ghost" id="signOut">Sign out</button></div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="db.js"></script>
<script src="games.js"></script>
<script>
const $ = id => document.getElementById(id), show = (id,on) => $(id).classList.toggle("hidden", !on);
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; }

// After sign-in, return to the game page that sent the host here (?next=<game id>).
const NEXT_KEY = "pg_next";
const qNext = new URLSearchParams(location.search).get("next");
if(qNext) try{ sessionStorage.setItem(NEXT_KEY, qNext); }catch(e){}
function nextGame(){ let id = qNext; try{ id = id || sessionStorage.getItem(NEXT_KEY); sessionStorage.removeItem(NEXT_KEY); }catch(e){}
  return PARTY_GAMES.find(g=>g.id===id) || null; }

async function renderGames(me){
  const box = $("games"); box.innerHTML = "";
  for(const g of PARTY_GAMES){
    const a = el("a","game"); a.href = g.path + "admin.html";
    const txt = el("div","txt"); txt.append(el("b",null,g.name), el("div","sub",g.blurb));
    const go = el("span","go","Open →");
    a.append(el("span","ico",g.emoji), txt, go); box.append(a);
    if(g.count) g.count(me).then(n=>{ go.textContent = n + " " + g.unit[n===1?0:1] + " →"; }).catch(()=>{});
  }
  const soon = el("div","game soon"); soon.append(el("span","ico","➕"), el("span",null,"More games coming soon"));
  box.append(soon);
}

$("pwForm").onsubmit = async e => { e.preventDefault(); $("loginErr").textContent = "";
  try{ await DB.signInWithPassword($("em").value.trim(), $("pw").value); await start(); }catch(err){ $("loginErr").textContent = err.message; } };
$("google").onclick = async () => { $("loginErr").textContent = ""; $("google").disabled = true;
  try{ await DB.signInWithGoogle(); }catch(err){ $("loginErr").textContent = err.message; $("google").disabled = false; } };
$("signOut").onclick = async () => { await DB.signOut(); location.href = location.pathname; };

let me = null;
async function start(){
  const s = await DB.session();
  show("login", !s); show("panel", false);
  const err = new URLSearchParams(location.hash.slice(1)).get("error_description");
  if(err) $("loginErr").textContent = err;
  if(!s){ $("who").textContent = "Games for your party, played from a shared link"; return; }
  me = s.user;
  const g = nextGame();
  if(g){ location.replace(g.path + "admin.html"); return; }
  if(location.hash || location.search) history.replaceState(null, "", location.pathname);
  $("who").textContent = DB.live ? `Signed in as ${me.email}` : "Demo mode: saved in this browser only";
  show("signOut", DB.live); show("panel", true);
  await renderGames(me);
}
DB.onAuth(evt => { if(evt === "SIGNED_IN" && !me) start(); });
start();
</script>
</body></html>
